<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>ジョーバ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #000;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
    }
    canvas { display: block; }
  </style>
</head>
<body>

  <!-- ==== HUD ==== -->
  <div id="hud" style="
    position:fixed; top:0; left:0; width:100%; pointer-events:none;
    padding:10px 12px; z-index:10; display:none; font-family:system-ui,sans-serif;">

    <div style="display:flex; gap:10px; align-items:center; margin-bottom:6px;">
      <span id="hudRank" style="color:#fff; font-size:15px; font-weight:700; text-shadow:0 1px 4px #000;"></span>
      <span id="hudPace" style="color:#ffe066; font-size:14px; font-weight:700; text-shadow:0 1px 4px #000;"></span>
    </div>

    <!-- Stamina bar -->
    <div style="display:flex; align-items:center; gap:6px; margin-bottom:4px;">
      <span style="color:#fff; font-size:11px; width:52px; text-shadow:0 1px 3px #000;">スタミナ</span>
      <div style="flex:1; height:10px; background:rgba(0,0,0,0.4); border-radius:5px; overflow:hidden;">
        <div id="hudStaminaFill" style="height:100%; background:#44ff44; border-radius:5px; transition:width 0.1s;"></div>
      </div>
    </div>

    <!-- Speed bar -->
    <div style="display:flex; align-items:center; gap:6px;">
      <span style="color:#fff; font-size:11px; width:52px; text-shadow:0 1px 3px #000;">スピード</span>
      <div style="flex:1; height:10px; background:rgba(0,0,0,0.4); border-radius:5px; overflow:hidden;">
        <div id="hudSpeedFill" style="height:100%; background:#44aaff; border-radius:5px; transition:width 0.1s;"></div>
      </div>
    </div>

    <!-- Kakari indicator -->
    <div id="hudKakari" style="color:#ff4444; font-size:18px; font-weight:900;
      text-shadow:0 0 8px #ff0000; display:none; margin-top:4px;">⚡ 掛かり！</div>
  </div>

  <!-- ==== CONTROLS ==== -->
  <div id="controls" style="display:none; pointer-events:none; z-index:20; position:fixed; bottom:0; left:0; width:100%;">
    <div id="btnHold" style="
      position:absolute; bottom:80px; left:20px;
      width:76px; height:76px; border-radius:50%;
      background:rgba(255,255,255,0.22); border:2px solid rgba(255,255,255,0.5);
      display:flex; align-items:center; justify-content:center;
      font-size:30px; pointer-events:auto; touch-action:none; user-select:none;">▼</div>
    <div id="btnAccel" style="
      position:absolute; bottom:80px; right:20px;
      width:76px; height:76px; border-radius:50%;
      background:rgba(255,255,255,0.22); border:2px solid rgba(255,255,255,0.5);
      display:flex; align-items:center; justify-content:center;
      font-size:30px; pointer-events:auto; touch-action:none; user-select:none;">▲</div>
  </div>

  <!-- ==== UI-SCREENS ==== -->
  <!-- Title screen -->
  <div id="screenTitle" style="
    position:fixed; inset:0; background:linear-gradient(180deg,#0a0a2e,#1a1a4e);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    z-index:50; font-family:system-ui,sans-serif; color:#fff;">
    <h1 style="font-size:52px; font-weight:900; letter-spacing:4px; margin:0 0 8px;
      text-shadow:0 0 20px #44aaff;">ジョーバ</h1>
    <p style="font-size:14px; color:#aaa; margin:0 0 40px;">騎手視点3D競馬ゲーム</p>
    <button id="btnStart" style="
      font-size:20px; padding:14px 48px; border-radius:40px;
      background:#44aaff; color:#fff; border:none; font-weight:700;
      touch-action:manipulation; cursor:pointer;">レース開始</button>
    <p style="font-size:12px; color:#666; margin-top:16px;">横持ち推奨</p>
  </div>

  <!-- Finish/result overlay -->
  <div id="screenResult" style="
    position:fixed; inset:0; background:rgba(0,0,0,0.75);
    display:none; flex-direction:column; align-items:center; justify-content:center;
    z-index:50; font-family:system-ui,sans-serif; color:#fff;">
    <h2 style="font-size:28px; margin:0 0 12px;">レース終了！</h2>
    <div id="resultRank"  style="font-size:48px; font-weight:900; margin-bottom:8px;"></div>
    <div id="resultHorse" style="font-size:18px; color:#aaa; margin-bottom:4px;"></div>
    <div id="resultTime"  style="font-size:16px; margin-bottom:4px;"></div>
    <div id="resultScore" style="font-size:22px; color:#ffe066; font-weight:700; margin-bottom:24px;"></div>
    <button id="btnRetry" style="
      font-size:18px; padding:12px 40px; border-radius:30px;
      background:#44aaff; color:#fff; border:none; font-weight:700;
      touch-action:manipulation; cursor:pointer;">もう一度</button>
  </div>

  <script type="importmap">
  {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js"}}
  </script>
  <script type="module">
  import * as THREE from 'three';

  // ==== SECTION: CONFIG ====
  // ==== CONFIG-BEGIN ====
  const CONFIG = {
    // Track geometry
    STRAIGHT_LEN: 450,
    INSIDE_RADIUS: 120,
    LANE_WIDTH: 2.0,
    LANE_COUNT: 12,

    // Derived (computed once after CONFIG)
    get LAP_LEN() { return 2 * this.STRAIGHT_LEN + 2 * Math.PI * this.INSIDE_RADIUS; },
    get CORNER_LEN() { return Math.PI * this.INSIDE_RADIUS; },

    // ゴール板はコース上の固定位置（ホームストレッチ＝str1の430m地点）。
    // スタート位置は距離ごとに (GOAL_S - distance) mod LAP_LEN で決まる
    GOAL_S: 430,

    // Physics
    ACCEL_BASE: 3.2,        // m/s²
    CRUISE_RATIO: 0.91,     // cruiseSpeed = maxSpeed * CRUISE_RATIO
    STAMINA_MAX: 1000,
    DRAIN_RACE_FRAC: 0.45,  // 巡航のまま全行程を走った場合に消費するプール割合
    DRAIN_ACCEL_K: 1.2,     // extra drain × (v - cruise)² when above cruise
    RECOVER_RATE: 7,        // stamina/s when below cruise×0.97
    BATE_THRESH_1: 0.30,    // stamina fraction → maxSpeed −0.5 m/s
    BATE_THRESH_2: 0.15,    // stamina fraction → maxSpeed −1.2 m/s
    BATE_SPEED_FLOOR: 0.89, // stamina=0 → speed capped at cruise × this
    SPURT_FRESH_K: 0.8,     // 末脚：残スタミナ割合×この値だけ最高速度が上乗せされる
    SPURT_FRESH_MAX: 0.5,   // 上乗せの上限 m/s
    CORNER_PENALTY: 0.008,  // speed multiplier loss per outer lane on corners
    START_NEUTRAL_DIST: 300, // 発走直後この距離はコーナーロスを無効化（コーナー発走の枠順不公平を防ぐ）
    // 距離によるペース感の補正（長丁場ほど全体に巡航が落ちる）
    DIST_SPEED_MUL: { 1200: 1.0, 1600: 0.995, 2000: 0.985, 2400: 0.97 },

    // Start (gate)
    START_DELAY_BASE: 0.05,
    START_DELAY_GATE: 0.25, // ゲート下手による平均遅延の幅
    BAD_START_PROB: 0.06,   // ×(100-gate)/100 で大出遅れ確率
    BAD_START_EXTRA_MIN: 0.4,
    BAD_START_EXTRA_MAX: 0.7,

    // Pace label (先頭の15%→50%区間平均速度 ÷ 出走馬の巡航平均)
    PACE_HIGH: 1.031,
    PACE_SLOW: 1.021,

    // Interactions
    SLIP_MUL: 0.85,
    SLIP_Z_MIN: 0.3, SLIP_Z_MAX: 6.0, SLIP_LANE_MAX: 0.5,
    WALL_GAP: 2.8,
    WALL_LANE_MAX: 0.8,
    LANE_CHANGE_BLOCK: 2.2,
    LANE_CHANGE_SPEED: 1.0, // lanes/s

    // Kakari
    KAKARI_TEMP_THRESH: 45,
    KAKARI_EXCESS: 0.45,    // m/s above cruise needed
    KAKARI_TIME: 1.2,       // s of excess before trigger
    KAKARI_PHASE: 0.35,     // レース前半のこの割合までしか発生しない（序盤限定）
    KAKARI_PROB: 0.5,       // 条件成立中の毎秒発生確率
    KAKARI_TARGET: 1.3,     // excess during kakari
    KAKARI_DRAIN: 1.5,
    KAKARI_NATURAL: 12,     // s to self-resolve
    KAKARI_RELEASE: 1.8,    // s of hold to release early
    PULL_FACTOR: 0.025,     // 気性難の「行きたがり」：(50-気性)×この値だけ序盤に勝手に加速
    PULL_MAX: 0.8,

    // Going multipliers
    GOING_MUL: { '良': 1.0, '稍重': 0.99, '重': 0.978, '不良': 0.965 },

    // Score
    RANK_POINTS: [1000, 600, 400, 250, 150, 100, 80, 60, 40, 25, 15, 10],
    BASE_TIMES: {
      1200: { '良': 70.0,  '稍重': 70.7,  '重': 71.8,  '不良': 72.8  },
      1600: { '良': 92.5,  '稍重': 93.4,  '重': 94.8,  '不良': 96.2  },
      2000: { '良': 117.5, '稍重': 118.7, '重': 120.4, '不良': 122.2 },
      2400: { '良': 142.5, '稍重': 143.9, '重': 146.1, '不良': 148.2 },
    },
    TIME_BONUS_PER_TENTH: 5,
    TIME_BONUS_MAX: 300,

    // Supabase (Phase 5 — leave empty for now)
    SUPABASE_URL: '',
    SUPABASE_KEY: '',
    GAME_SLUG: 'johba',
    CLIENT_VERSION: 'v0.1',
  };
  // ==== CONFIG-END ====

  // ==== SIM-CORE-BEGIN ====
  // ジョーバ レースシミュレーション中核。
  // ここには THREE / window / document / requestAnimationFrame など
  // ブラウザ依存を一切書かない（tools/sim-harness.mjs が node で抽出実行する）。

  // ── SECTION: HORSE-NAMES（SIM-CORE 内・純粋関数のため generateField から参照可能にする）──
  function generateHorseName(rng, idx) {
    const prefixes = ['サクラ','ディープ','ゴールド','シルバー','ブラック','ホワイト',
      'スター','グラン','ブルー','ロイヤル','ワイルド','ネオ','メガ','ライジング','ソルティ'];
    const suffixes = ['インパクト','フラッシュ','ライン','ウェーブ','ドリーム','ランナー',
      'ブレイズ','ストーム','リバー','フォース','シャイン','パッション','アロー','ウィンド',
      'バーニング','エクスプレス','ファントム','サンダー'];
    const p = prefixes[Math.floor(rng() * prefixes.length)];
    const s = suffixes[Math.floor(rng() * suffixes.length)];
    const full = p + s;
    return full.length > 9 ? full.slice(0, 9) : full;
  }

  // ── makeRng: Mulberry32 ──
  function makeRng(seed) {
    let s = seed >>> 0;
    return function() {
      s += 0x6D2B79F5;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // ── createRaceConditions ──
  function createRaceConditions(rng, overrides = {}) {
    const distances = [1200, 1600, 2000, 2400];
    const distance = overrides.distance ?? distances[Math.floor(rng() * distances.length)];

    // Weather: 晴 50%, 曇 30%, 雨 20%
    const wr = rng();
    const weather = overrides.weather ?? (wr < 0.5 ? '晴' : wr < 0.8 ? '曇' : '雨');

    // Going correlated with weather
    let going;
    if (overrides.going) {
      going = overrides.going;
    } else if (weather === '晴') {
      going = '良';
    } else if (weather === '曇') {
      going = rng() < 0.7 ? '良' : '稍重';
    } else { // 雨
      const gr = rng();
      going = gr < 0.3 ? '稍重' : gr < 0.7 ? '重' : '不良';
    }

    const baseTime = CONFIG.BASE_TIMES[distance][going];
    return { distance, weather, going, baseTime };
  }

  // ── generateField ──
  function generateField(rng, cond) {
    // Style pool for 12 horses
    const stylePool = [];
    const nigeCount = Math.floor(rng() * 2) + 1; // 1-2
    const senkoCount = Math.floor(rng() * 2) + 3; // 3-4
    const sashiCount = Math.floor(rng() * 2) + 4; // 4-5
    const oikomiCount = 12 - nigeCount - senkoCount - sashiCount;
    for (let i = 0; i < nigeCount; i++) stylePool.push('nige');
    for (let i = 0; i < senkoCount; i++) stylePool.push('senko');
    for (let i = 0; i < sashiCount; i++) stylePool.push('sashi');
    for (let i = 0; i < oikomiCount; i++) stylePool.push('oikomi');
    // shuffle
    for (let i = stylePool.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [stylePool[i], stylePool[j]] = [stylePool[j], stylePool[i]];
    }

    const horses = [];
    for (let i = 0; i < 12; i++) {
      const randStat = () => Math.floor(rng() * 51) + 40; // 40-90
      horses.push({
        num: i + 1,
        name: generateHorseName(rng, i),
        style: stylePool[i],
        speed: randStat(),
        stamina: randStat(),
        burst: randStat(),
        power: randStat(),
        distFit: Math.floor(rng() * 4),
        goingFit: Math.floor(rng() * 4),
        temperament: Math.floor(rng() * 51) + 30, // 30-80
        gate: Math.floor(rng() * 101),
        condition: Math.floor(rng() * 51) + 50, // 50-100
        color: (i / 12) * 0xFFFFFF | 0, // placeholder; set properly below
        isPlayer: i === 0,
      });
    }

    // Normalize mean ability to ~62
    const means = horses.map(h => (h.speed + h.stamina + h.burst + h.power) / 4);
    const fieldMean = means.reduce((a, b) => a + b) / 12;
    if (fieldMean < 57 || fieldMean > 67) {
      const target = 62;
      const scale = target / fieldMean;
      horses.forEach(h => {
        h.speed  = Math.min(99, Math.max(10, Math.round(h.speed  * scale)));
        h.stamina= Math.min(99, Math.max(10, Math.round(h.stamina* scale)));
        h.burst  = Math.min(99, Math.max(10, Math.round(h.burst  * scale)));
        h.power  = Math.min(99, Math.max(10, Math.round(h.power  * scale)));
      });
    }

    // Assign 12 distinct hue-based colors for jockey silks (as 0xRRGGBB)
    horses.forEach((h, i) => {
      const hue = i / 12;
      // HSL to RGB
      const f = (n) => {
        const k = (n + hue * 12) % 12;
        return 0.5 - 0.5 * Math.max(Math.min(k - 3, 9 - k, 1), -1);
      };
      h.color = (Math.round(f(0) * 255) << 16) | (Math.round(f(8) * 255) << 8) | Math.round(f(4) * 255);
    });

    return horses;
  }

  // ── createRaceState ──
  function createRaceState(field, cond, rng, playerIndex) {
    // drainBase: 巡航のまま全行程を走った場合に DRAIN_RACE_FRAC を消費する基準値
    const approxCruise = 17.5 * CONFIG.GOING_MUL[cond.going];
    const approxTime = cond.distance / approxCruise;
    const drainBase = CONFIG.DRAIN_RACE_FRAC * CONFIG.STAMINA_MAX / approxTime;

    let cruiseSum = 0;

    const horses = field.map((def, i) => {
      // 当日の調子は「能力値」に±10%かける（最終速度に直接かけると影響が過大になる）
      const conditionMul = 0.9 + (def.condition / 100) * 0.2; // 0.9–1.1
      const effSpeed = def.speed * conditionMul;
      const effStamina = def.stamina * conditionMul;

      const maxSpeed = (17.2 + effSpeed * 0.022) * CONFIG.GOING_MUL[cond.going] *
        (CONFIG.DIST_SPEED_MUL[cond.distance] ?? 1.0);
      const cruiseSpeed = maxSpeed * CONFIG.CRUISE_RATIO;
      cruiseSum += cruiseSpeed;

      // Distance fit penalty: each category off from ideal adds 8% drain
      const distIdx = [1200, 1600, 2000, 2400].indexOf(cond.distance);
      const distPenalty = 1 + Math.abs(def.distFit - distIdx) * 0.08;

      // Going fit: goingFit 0=best on good, 3=best on heavy
      const goingIdx = { '良': 0, '稍重': 1, '重': 2, '不良': 3 }[cond.going] ?? 0;
      // パワーが高いほど道悪ペナルティを軽減
      const powerMitigation = Math.min(0.5, def.power * 0.004);
      const goingPenalty = 1 + Math.max(0, goingIdx - def.goingFit) * 0.06 * (1 - powerMitigation);

      const drainStaminaMul = (1.35 - effStamina * 0.0075) * distPenalty * goingPenalty;

      // スパート開始距離（残り距離基準）。脚質と個体差で毎レース変わる
      const styleKick = {
        nige:   400 + rng() * 150,
        senko:  550 + rng() * 200,
        sashi:  650 + rng() * 200,
        oikomi: 480 + rng() * 200,
      };
      const kickDist = Math.min(styleKick[def.style] ?? 550, cond.distance * 0.45);

      // スタート遅延（ゲートの上手さ）。下手な馬は稀に大きく出遅れる
      let startDelayOwn = CONFIG.START_DELAY_BASE +
        ((100 - def.gate) / 100) * CONFIG.START_DELAY_GATE + rng() * 0.06;
      if (rng() < ((100 - def.gate) / 100) * CONFIG.BAD_START_PROB) {
        startDelayOwn += CONFIG.BAD_START_EXTRA_MIN +
          rng() * (CONFIG.BAD_START_EXTRA_MAX - CONFIG.BAD_START_EXTRA_MIN);
      }

      return {
        idx: i,
        progress: 0,
        lane: i,             // starting lane = number − 1
        targetLane: i,
        laneF: i,            // float lane for smooth transition
        speed: 0,
        stamina: CONFIG.STAMINA_MAX,
        maxSpeed,
        cruiseSpeed,
        drainBase: drainBase * drainStaminaMul, // per-second at cruise
        startDelayOwn,
        isKakari: false,
        kakariTimer: 0,
        kakariAccum: 0,
        holdAccum: 0,        // for kakari release
        finished: false,
        finishTime: 0,
        legPhase: rng() * Math.PI * 2,
        ai_kickDist: kickDist,
        ai_aggr: 0.85 + rng() * 0.3,  // 個体のペース嗜好（毎レース変動）
        ai_blockTimer: 0,
        ai_railTimer: 1 + rng() * 2,  // 内ラチへ寄せる判断の間隔
      };
    });

    const lap = CONFIG.LAP_LEN;
    return {
      horses,
      field,
      cond,
      rng,
      // コース上のスタート位置（ゴール板固定・距離から逆算）
      startS: ((CONFIG.GOAL_S - cond.distance) % lap + lap) % lap,
      elapsed: 0,
      finishedCount: 0,
      results: [],
      kakariCount: 0,
      fieldCruiseAvg: cruiseSum / field.length,
      paceRatio: 0,
      paceRecorded: false,
      playerIndex,
      playerStartDelay: null, // ゲート演出のタップ精度で外から設定（未設定なら標準値）
      started: false,
      startDelay: 1.5 + rng() * 1.0, // 1.5–2.5s until gates open
      startTimer: 0,
    };
  }

  // ── stepRace ──
  function stepRace(state, dt, playerInput) {
    // Gate countdown（ゲート待ち中はレース時計を進めない）
    if (!state.started) {
      state.startTimer += dt;
      if (state.startTimer >= state.startDelay) {
        state.started = true;
      } else {
        return; // nothing moves yet
      }
    }

    state.elapsed += dt;

    const { horses, field, cond, rng } = state;

    // ペース計測：先頭が15%地点→50%地点を走った区間平均速度を出走馬の巡航平均と比較
    // （ゲートからの加速ロスを除くため2チェックポイント方式）
    if (!state.paceRecorded) {
      let leader = horses[0];
      for (const o of horses) if (o.progress > leader.progress) leader = o;
      if (state.paceT1 === undefined && leader.progress >= cond.distance * 0.15) {
        state.paceT1 = state.elapsed;
      }
      if (state.paceT1 !== undefined && leader.progress >= cond.distance * 0.5) {
        const segSpeed = (cond.distance * 0.35) / (state.elapsed - state.paceT1);
        state.paceRatio = segSpeed / state.fieldCruiseAvg;
        state.paceRecorded = true;
      }
    }

    for (let i = 0; i < horses.length; i++) {
      const h = horses[i];
      if (h.finished) continue;

      const def = field[i];
      const isPlayer = i === state.playerIndex;

      // 出遅れ：自分のゲート反応が済むまで動かない
      const ownDelay = isPlayer ? (state.playerStartDelay ?? 0.15) : h.startDelayOwn;
      if (state.elapsed < ownDelay) continue;

      // ── Lane change ──
      const input = isPlayer ? playerInput : null;
      if (isPlayer && input && input.laneDir !== 0) {
        const newTarget = Math.max(0, Math.min(CONFIG.LANE_COUNT - 1, h.targetLane + input.laneDir));
        // Check if blocked
        const blocked = horses.some((o, j) => {
          if (j === i || o.finished) return false;
          const prog_diff = o.progress - h.progress;
          return Math.abs(prog_diff) < CONFIG.LANE_CHANGE_BLOCK && Math.abs(o.laneF - newTarget) < 0.8;
        });
        if (!blocked) h.targetLane = newTarget;
      }

      // AI lane behavior: 詰まったら進路探し（スパート中は外、それ以外は内優先）、
      // 空いていれば内ラチへ寄せてコーナーの距離ロスを避ける
      if (!isPlayer) {
        h.ai_blockTimer -= dt;
        h.ai_railTimer -= dt;
        const blockedNow = isBlocked(horses, i, h.progress, h.laneF);
        const spurting = (cond.distance - h.progress) <= h.ai_kickDist;
        if (blockedNow && h.ai_blockTimer <= 0) {
          const prefs = spurting
            ? [h.targetLane + 1, h.targetLane - 1]
            : [h.targetLane - 1, h.targetLane + 1];
          for (const cand of prefs) {
            const lane2 = Math.max(0, Math.min(CONFIG.LANE_COUNT - 1, cand));
            if (lane2 === h.targetLane) continue;
            const occupied = horses.some((o, j) => j !== i && !o.finished &&
              Math.abs(o.progress - h.progress) < CONFIG.LANE_CHANGE_BLOCK &&
              Math.abs(o.laneF - lane2) < 0.8);
            if (!occupied) { h.targetLane = lane2; h.ai_blockTimer = 1.5 + rng() * 1.5; break; }
          }
        } else if (!blockedNow && h.ai_railTimer <= 0 && h.targetLane > 0) {
          const inner = h.targetLane - 1;
          const occupied = horses.some((o, j) => j !== i && !o.finished &&
            Math.abs(o.progress - h.progress) < CONFIG.LANE_CHANGE_BLOCK + 1.5 &&
            Math.abs(o.laneF - inner) < 0.8);
          if (!occupied) h.targetLane = inner;
          h.ai_railTimer = 1.5 + rng() * 2.0;
        }
      }

      // Smooth lane transition
      const laneDiff = h.targetLane - h.laneF;
      if (Math.abs(laneDiff) > 0.01) {
        h.laneF += Math.sign(laneDiff) * Math.min(Math.abs(laneDiff), CONFIG.LANE_CHANGE_SPEED * dt);
      } else {
        h.laneF = h.targetLane;
      }
      h.lane = Math.round(h.laneF);

      // ── Slipstream ──
      let drainMul = 1.0;
      for (let j = 0; j < horses.length; j++) {
        if (j === i || horses[j].finished) continue;
        const ahead = horses[j].progress - h.progress;
        const laneDiff2 = Math.abs(horses[j].laneF - h.laneF);
        if (ahead > CONFIG.SLIP_Z_MIN && ahead < CONFIG.SLIP_Z_MAX && laneDiff2 < CONFIG.SLIP_LANE_MAX) {
          drainMul = CONFIG.SLIP_MUL;
          break;
        }
      }

      // ── Wall blocking ──
      let speedCap = Infinity;
      if (isBlocked(horses, i, h.progress, h.laneF)) {
        // Cap at the blocking horse's speed
        for (let j = 0; j < horses.length; j++) {
          if (j === i || horses[j].finished) continue;
          const ahead = horses[j].progress - h.progress;
          if (ahead > 0 && ahead < CONFIG.WALL_GAP && Math.abs(horses[j].laneF - h.laneF) < CONFIG.WALL_LANE_MAX) {
            speedCap = Math.min(speedCap, horses[j].speed);
          }
        }
      }

      // ── Target speed ──
      const remaining = cond.distance - h.progress;
      const opening = h.progress < Math.min(500, cond.distance * 0.25);
      const inSpurt = remaining <= h.ai_kickDist;
      let targetSpeed;

      if (isPlayer) {
        if (input && input.accel) {
          targetSpeed = h.maxSpeed + 1; // 実際の上限は effectiveMax（末脚ボーナス込み）で決まる
        } else if (input && input.hold) {
          targetSpeed = h.cruiseSpeed * 0.85;
        } else {
          targetSpeed = h.cruiseSpeed;
        }
        // 行きたがり：気性難の馬は序盤、抑えないと勝手にペースが上がる
        if (opening && def.temperament < 50 && !(input && input.hold)) {
          targetSpeed += Math.min(CONFIG.PULL_MAX,
            (50 - def.temperament) * CONFIG.PULL_FACTOR);
        }
      } else {
        // AI: 脚質に従い「序盤の位置取り → 道中温存 → スパート」を演じる
        if (def.style === 'nige') {
          if (inSpurt) {
            targetSpeed = h.maxSpeed + 1; // effectiveMaxでクランプされる
          } else if (opening) {
            // 先頭を主張。前に馬がいる間は脚を使い、ハナを取れたら息を入れる
            let drive = 0.15;
            let anotherNigeNear = false;
            let someoneAhead = false;
            for (let j = 0; j < horses.length; j++) {
              if (j === i || horses[j].finished) continue;
              if (horses[j].progress > h.progress + 2) someoneAhead = true;
              if (field[j].style === 'nige' &&
                  Math.abs(horses[j].progress - h.progress) < 6) anotherNigeNear = true;
            }
            if (someoneAhead) drive = 0.9;
            if (anotherNigeNear) drive += 0.35; // ハナ争い＝ハイペースの源
            targetSpeed = h.cruiseSpeed + drive * h.ai_aggr;
          } else {
            targetSpeed = h.cruiseSpeed + 0.12 * h.ai_aggr;
          }
        } else if (def.style === 'senko') {
          targetSpeed = inSpurt ? h.maxSpeed + 1
                      : opening ? h.cruiseSpeed + 0.35 * h.ai_aggr
                      : h.cruiseSpeed;
        } else if (def.style === 'sashi') {
          targetSpeed = inSpurt ? h.maxSpeed + 1
                      : opening ? h.cruiseSpeed - 0.15
                      : h.cruiseSpeed * 0.99;
        } else { // oikomi
          targetSpeed = inSpurt ? h.maxSpeed + 1
                      : opening ? h.cruiseSpeed - 0.3
                      : h.cruiseSpeed * 0.975;
        }
        // スタミナ残量を見た自重（スパート区間では使い切る）
        if (!inSpurt && h.stamina < CONFIG.STAMINA_MAX * 0.20) {
          targetSpeed = Math.min(targetSpeed, h.cruiseSpeed - 0.45);
        }
        // Add small random variance each step
        targetSpeed *= (0.997 + rng() * 0.006);
      }

      // ── Kakari ──（序盤限定・確率発生。気性難×ペースの上げすぎで起こる）
      if (!h.isKakari &&
          def.temperament < CONFIG.KAKARI_TEMP_THRESH &&
          h.progress < cond.distance * CONFIG.KAKARI_PHASE) {
        const excess = h.speed - h.cruiseSpeed;
        if (excess > CONFIG.KAKARI_EXCESS) {
          h.kakariAccum += dt;
          if (h.kakariAccum >= CONFIG.KAKARI_TIME && rng() < CONFIG.KAKARI_PROB * dt) {
            h.isKakari = true;
            // AIは4〜8秒で自然に折り合いを取り戻す。プレイヤーは抑え操作で解消
            h.kakariTimer = isPlayer ? CONFIG.KAKARI_NATURAL : 4 + rng() * 4;
            state.kakariCount++;
          }
        } else {
          h.kakariAccum = Math.max(0, h.kakariAccum - dt * 0.5);
        }
      }

      if (h.isKakari) {
        targetSpeed = h.cruiseSpeed + CONFIG.KAKARI_TARGET;
        drainMul *= CONFIG.KAKARI_DRAIN;
        h.kakariTimer -= dt;
        if (isPlayer && input && input.hold) {
          h.holdAccum += dt;
          if (h.holdAccum >= CONFIG.KAKARI_RELEASE) h.isKakari = false;
        } else if (isPlayer) {
          h.holdAccum = 0;
        }
        if (h.kakariTimer <= 0) {
          h.isKakari = false;
          h.kakariAccum = 0;
        }
      }

      // Apply wall cap
      targetSpeed = Math.min(targetSpeed, speedCap);

      // ── Bate (stamina-based speed limits) ──
      // 残スタミナが多いほど末脚が伸びる（スタミナ温存の報酬）
      const staminaFrac = h.stamina / CONFIG.STAMINA_MAX;
      let effectiveMax = h.maxSpeed +
        Math.min(CONFIG.SPURT_FRESH_MAX, staminaFrac * CONFIG.SPURT_FRESH_K);
      if (staminaFrac <= 0) {
        effectiveMax = Math.min(h.cruiseSpeed * CONFIG.BATE_SPEED_FLOOR, effectiveMax);
      } else if (staminaFrac < CONFIG.BATE_THRESH_2) {
        effectiveMax -= 1.2;
      } else if (staminaFrac < CONFIG.BATE_THRESH_1) {
        effectiveMax -= 0.5;
      }
      targetSpeed = Math.min(targetSpeed, effectiveMax);
      targetSpeed = Math.max(targetSpeed, 0);

      // ── Acceleration ──
      const accelScale = 0.85 + (def.burst / 100) * 0.3; // 0.85–1.15
      const accel = CONFIG.ACCEL_BASE * accelScale;
      const speedDiff = targetSpeed - h.speed;
      h.speed += Math.sign(speedDiff) * Math.min(Math.abs(speedDiff), accel * dt);
      h.speed = Math.max(0, h.speed);

      // ── Stamina drain ──
      const aboveCruise = Math.max(0, h.speed - h.cruiseSpeed);
      const drain = h.drainBase * dt * (1 + CONFIG.DRAIN_ACCEL_K * aboveCruise * aboveCruise) * drainMul;
      h.stamina = Math.max(0, h.stamina - drain);

      // Slight recovery when going slow
      if (h.speed < h.cruiseSpeed * 0.97) {
        h.stamina = Math.min(CONFIG.STAMINA_MAX, h.stamina + CONFIG.RECOVER_RATE * dt);
      }

      // ── Corner penalty → progress ──
      // コース位置 = startS + progress。発走直後の中立区間はロスなし
      // （コーナー発走時の枠順不公平を防ぐ）
      const onCorner = h.progress >= CONFIG.START_NEUTRAL_DIST &&
        isOnCorner(state.startS + h.progress);
      const cornerFac = onCorner ? (1 - h.lane * CONFIG.CORNER_PENALTY) : 1.0;
      h.progress += h.speed * cornerFac * dt;

      // Leg animation phase
      h.legPhase += (h.speed / 3.0) * 2 * Math.PI * dt;

      // ── Finish check ──（行き過ぎ分を補間して正確な通過時刻を出す）
      if (h.progress >= cond.distance) {
        h.finished = true;
        const overshoot = h.progress - cond.distance;
        h.finishTime = state.elapsed - (h.speed > 0.1 ? overshoot / h.speed : 0);
        h.progress = cond.distance;
        state.results.push({ index: i, finishTime: h.finishTime, rank: 0 });
        state.results.sort((a, b) => a.finishTime - b.finishTime);
        state.results.forEach((r, ri) => { r.rank = ri + 1; });
        state.finishedCount++;
      }
    }
  }

  // Helper: is horse i blocked by someone ahead?
  function isBlocked(horses, i, progress, laneF) {
    return horses.some((o, j) => {
      if (j === i || o.finished) return false;
      const ahead = o.progress - progress;
      return ahead > 0 && ahead < CONFIG.WALL_GAP && Math.abs(o.laneF - laneF) < CONFIG.WALL_LANE_MAX;
    });
  }

  // Helper: is progress on a corner section?
  function isOnCorner(progress) {
    const s = ((progress % CONFIG.LAP_LEN) + CONFIG.LAP_LEN) % CONFIG.LAP_LEN;
    const c = CONFIG.CORNER_LEN;
    const sl = CONFIG.STRAIGHT_LEN;
    return (s > sl && s < sl + c) || (s > 2 * sl + c);
  }

  // ── paceLabel ──（先頭の中間点平均速度 ÷ 出走馬の巡航平均で相対判定）
  function paceLabel(state) {
    if (!state.paceRecorded) return 'ミドル';
    if (state.paceRatio > CONFIG.PACE_HIGH) return 'ハイ';
    if (state.paceRatio < CONFIG.PACE_SLOW) return 'スロー';
    return 'ミドル';
  }
  // ==== SIM-CORE-END ====

  // ==== SECTION: HORSE-NAMES ====
  // 馬名生成（generateHorseName）は SIM-CORE 内に配置済み。
  // ヘッドレス検証（sim-harness）が generateField から参照できる必要があるため。

  // ==== SECTION: THREE-SCENE ====

  // Progress is measured along the INSIDE RAIL centerline.
  // worldPos: (progress_meters, lane_float) → [x, y, z]
  function worldPos(progress, lane) {
    const { LAP_LEN, STRAIGHT_LEN, INSIDE_RADIUS, LANE_WIDTH } = CONFIG;
    let s = ((progress % LAP_LEN) + LAP_LEN) % LAP_LEN;
    const lc = INSIDE_RADIUS + (lane + 0.5) * LANE_WIDTH; // lane center radius

    if (s < STRAIGHT_LEN) {
      return [lc, 0, s - STRAIGHT_LEN * 0.5];
    }
    s -= STRAIGHT_LEN;
    const cl = CONFIG.CORNER_LEN;
    if (s < cl) {
      const a = s / INSIDE_RADIUS; // 0→π
      return [lc * Math.cos(a), 0, STRAIGHT_LEN * 0.5 + lc * Math.sin(a)];
    }
    s -= cl;
    if (s < STRAIGHT_LEN) {
      return [-lc, 0, STRAIGHT_LEN * 0.5 - s];
    }
    s -= STRAIGHT_LEN;
    const a2 = Math.PI + s / INSIDE_RADIUS; // π→2π
    return [lc * Math.cos(a2), 0, -STRAIGHT_LEN * 0.5 + lc * Math.sin(a2)];
  }

  // Horse rotation around Y axis (0 = facing +z)
  function headingAngle(progress) {
    const { LAP_LEN, STRAIGHT_LEN, INSIDE_RADIUS, CORNER_LEN } = CONFIG;
    let s = ((progress % LAP_LEN) + LAP_LEN) % LAP_LEN;
    if (s < STRAIGHT_LEN) return 0;
    s -= STRAIGHT_LEN;
    if (s < CORNER_LEN) return -(s / INSIDE_RADIUS);
    s -= CORNER_LEN;
    if (s < STRAIGHT_LEN) return -Math.PI;
    s -= STRAIGHT_LEN;
    return -(Math.PI + s / INSIDE_RADIUS);
  }

  // Scene setup
  const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = false;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87CEEB);
  scene.fog = new THREE.Fog(0x87CEEB, 100, 350);

  const camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.5, 500);

  // Lighting
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const sun = new THREE.DirectionalLight(0xffffff, 0.8);
  sun.position.set(50, 100, 50);
  scene.add(sun);

  // ── Course geometry ──
  function buildCourse() {
    // Ground plane
    const groundGeo = new THREE.PlaneGeometry(800, 800);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x3a7d44 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.05;
    scene.add(ground);

    // Track strip (ring following the path), built as a BufferGeometry of quads
    const SEG = 160;
    const positions = [];
    const indices = [];
    const innerLane = -0.5;
    const outerLane = CONFIG.LANE_COUNT - 0.5;
    for (let k = 0; k <= SEG; k++) {
      const p = (k / SEG) * CONFIG.LAP_LEN;
      const [ix, , iz] = worldPos(p, innerLane);
      const [ox, , oz] = worldPos(p, outerLane);
      positions.push(ix, 0, iz);
      positions.push(ox, 0, oz);
    }
    for (let k = 0; k < SEG; k++) {
      const a = k * 2, b = k * 2 + 1, c = k * 2 + 2, d = k * 2 + 3;
      indices.push(a, b, c);
      indices.push(b, d, c);
    }
    const trackGeo = new THREE.BufferGeometry();
    trackGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    trackGeo.setIndex(indices);
    trackGeo.computeVertexNormals();
    const trackMat = new THREE.MeshLambertMaterial({ color: 0xc8a86b, side: THREE.DoubleSide });
    const track = new THREE.Mesh(trackGeo, trackMat);
    scene.add(track);

    // Rail posts via InstancedMesh (inner + outer)
    const postGeo = new THREE.BoxGeometry(0.15, 1.2, 0.15);
    const postMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
    const postSpacing = 20;
    const postCount = Math.floor(CONFIG.LAP_LEN / postSpacing);
    const railPosts = new THREE.InstancedMesh(postGeo, postMat, postCount * 2);
    const dummy = new THREE.Object3D();
    let inst = 0;
    for (let k = 0; k < postCount; k++) {
      const p = k * postSpacing;
      const [ix, , iz] = worldPos(p, -0.5);
      dummy.position.set(ix, 0.6, iz);
      dummy.rotation.set(0, 0, 0);
      dummy.updateMatrix();
      railPosts.setMatrixAt(inst++, dummy.matrix);
      const [ox, , oz] = worldPos(p, CONFIG.LANE_COUNT + 0.5);
      dummy.position.set(ox, 0.6, oz);
      dummy.updateMatrix();
      railPosts.setMatrixAt(inst++, dummy.matrix);
    }
    railPosts.instanceMatrix.needsUpdate = true;
    scene.add(railPosts);

    // ゴール板（コース固定位置 GOAL_S。ホームストレッチ上なので向きはx軸沿いでよい）
    const finishGeo = new THREE.PlaneGeometry(CONFIG.LANE_COUNT * CONFIG.LANE_WIDTH + 2, 1.5);
    const finishMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
    const finish = new THREE.Mesh(finishGeo, finishMat);
    finish.rotation.x = -Math.PI / 2;
    const [fx, , fz] = worldPos(CONFIG.GOAL_S, (CONFIG.LANE_COUNT - 1) / 2);
    finish.position.set(fx, 0.02, fz);
    scene.add(finish);

    // ゴール板の柱
    const goalPostGeo = new THREE.BoxGeometry(0.25, 3.5, 0.25);
    const goalPostMat = new THREE.MeshLambertMaterial({ color: 0xdd2222 });
    const goalPost = new THREE.Mesh(goalPostGeo, goalPostMat);
    const [gx, , gz] = worldPos(CONFIG.GOAL_S, -1.0);
    goalPost.position.set(gx, 1.75, gz);
    scene.add(goalPost);

    // ハロン棒：ゴールから200mごとの残距離標識（コース固定）
    const halonGeo = new THREE.BoxGeometry(0.3, 2, 0.3);
    const halonMat = new THREE.MeshLambertMaterial({ color: 0xff5050 });
    for (let k = 1; k <= 7; k++) {
      const p = ((CONFIG.GOAL_S - 200 * k) % CONFIG.LAP_LEN + CONFIG.LAP_LEN) % CONFIG.LAP_LEN;
      const halon = new THREE.Mesh(halonGeo, halonMat);
      const [hx, , hz] = worldPos(p, CONFIG.LANE_COUNT + 1.2);
      halon.position.set(hx, 1, hz);
      scene.add(halon);
    }
  }
  buildCourse();

  // ── Horse model ──
  function createHorseModel(color, silksColor) {
    const g = new THREE.Group();

    const bodyGeo   = new THREE.BoxGeometry(0.9, 0.5, 2.2);
    const neckGeo   = new THREE.CylinderGeometry(0.12, 0.18, 0.55, 6);
    const headGeo   = new THREE.BoxGeometry(0.22, 0.25, 0.45);
    const legGeo    = new THREE.CylinderGeometry(0.08, 0.08, 0.65, 5);
    const riderGeo  = new THREE.CylinderGeometry(0.12, 0.15, 0.34, 6);
    const helmetGeo = new THREE.SphereGeometry(0.16, 7, 5);

    const bodyMat   = new THREE.MeshLambertMaterial({ color });
    const legMat    = new THREE.MeshLambertMaterial({ color: 0x2a1a0a });
    const silksMat  = new THREE.MeshLambertMaterial({ color: silksColor });
    const helmetMat = new THREE.MeshLambertMaterial({ color: 0xffffff });

    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.set(0, 0.25, 0);
    g.add(body);

    const neck = new THREE.Mesh(neckGeo, bodyMat);
    neck.position.set(0, 0.65, 0.8);
    neck.rotation.x = -0.4;
    g.add(neck);

    const head = new THREE.Mesh(headGeo, bodyMat);
    head.position.set(0, 0.82, 1.1);
    g.add(head);

    // Four legs
    const legOffsets = [[-0.3, -0.33, 0.6], [0.3, -0.33, 0.6], [-0.3, -0.33, -0.6], [0.3, -0.33, -0.6]];
    const legMeshes = legOffsets.map(([x, y, z]) => {
      const m = new THREE.Mesh(legGeo, legMat);
      m.position.set(x, y, z);
      g.add(m);
      return m;
    });

    const rider = new THREE.Mesh(riderGeo, silksMat);
    rider.position.set(0, 0.72, -0.3);
    g.add(rider);

    const helmet = new THREE.Mesh(helmetGeo, helmetMat);
    helmet.position.set(0, 0.98, -0.3);
    g.add(helmet);

    // Attach leg refs for animation
    g.userData.legs = { fl: legMeshes[0], fr: legMeshes[1], bl: legMeshes[2], br: legMeshes[3] };

    return g;
  }

  // ── Update horse meshes each frame ──
  function updateHorseMeshes(state, frameCount) {
    state.horses.forEach((h, i) => {
      const cs = state.startS + h.progress; // コース位置
      const [x, , z] = worldPos(cs, h.laneF);
      horseMeshes[i].position.set(x, 0, z);
      horseMeshes[i].rotation.y = headingAngle(cs);

      // Leg animation with performance gating
      const playerPos = horseMeshes[state.playerIndex].position;
      const dist = Math.hypot(x - playerPos.x, z - playerPos.z);
      const animEvery = dist > 120 ? 0 : dist > 50 ? 3 : 1;
      if (animEvery > 0 && frameCount % animEvery === 0) {
        const { fl, fr, bl, br } = horseMeshes[i].userData.legs;
        const ph = h.legPhase;
        fl.rotation.x = Math.sin(ph) * 0.55;
        br.rotation.x = Math.sin(ph) * 0.55;
        fr.rotation.x = Math.sin(ph + Math.PI) * 0.55;
        bl.rotation.x = Math.sin(ph + Math.PI) * 0.55;
      }
    });
  }

  // ── Camera ──
  function updateCamera(state) {
    const h = state.horses[state.playerIndex];
    const cs = state.startS + h.progress; // コース位置
    const [px, , pz] = worldPos(cs, h.laneF);
    const ang = headingAngle(cs);
    // Back-vector: opposite of heading direction (heading faces +z when ang=0)
    const bx = -Math.sin(ang);
    const bz = -Math.cos(ang);

    const targetX = px + bx * 8;
    const targetZ = pz + bz * 8;
    const targetY = 3.2;

    camera.position.lerp(new THREE.Vector3(targetX, targetY, targetZ), 0.12);

    const speedFrac = h.speed / h.maxSpeed;
    // Camera shake
    const shake = speedFrac * 0.018;
    camera.position.x += (Math.random() - 0.5) * shake;
    camera.position.y += (Math.random() - 0.5) * shake * 0.5;

    camera.lookAt(px, 0.5, pz);

    camera.fov = 65 + speedFrac * 10;
    camera.updateProjectionMatrix();
  }

  // ==== SECTION: GAME-LOOP ====
  let raceState = null;
  let horseMeshes = [];
  let shownResults = false;
  let frameCount = 0;
  let lastTime = performance.now();
  let accumulator = 0;
  const SIM_DT = 1 / 60;

  function gameLoop(now) {
    requestAnimationFrame(gameLoop);

    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    if (raceState && !shownResults) {
      accumulator += dt;
      accumulator = Math.min(accumulator, 0.1);
      while (accumulator >= SIM_DT) {
        stepRace(raceState, SIM_DT, currentInput);
        accumulator -= SIM_DT;
      }

      updateHorseMeshes(raceState, frameCount);
      updateCamera(raceState);
      updateHUD(raceState);

      if (raceState.finishedCount === 12 && !shownResults) {
        shownResults = true;
        showFinishScreen(raceState);
      }
    }

    renderer.render(scene, camera);
    frameCount++;
  }

  requestAnimationFrame(gameLoop);

  // Keep renderer/camera in sync with viewport
  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // ==== SECTION: HUD ====
  function updateHUD(state) {
    const h = state.horses[state.playerIndex];
    const remaining = Math.max(0, state.cond.distance - h.progress);
    const currentRank = state.horses.filter(o => !o.finished && o.progress > h.progress).length + 1;

    document.getElementById('hudRank').textContent =
      `${h.finished ? state.results.find(r => r.index === state.playerIndex)?.rank ?? '?' : currentRank}番手 / 残り${Math.round(remaining)}m`;
    document.getElementById('hudPace').textContent = paceLabel(state);

    const stPct = (h.stamina / CONFIG.STAMINA_MAX * 100).toFixed(1);
    const spPct = (h.speed / h.maxSpeed * 100).toFixed(1);
    const stEl = document.getElementById('hudStaminaFill');
    stEl.style.width = stPct + '%';
    stEl.style.background = h.stamina < CONFIG.STAMINA_MAX * 0.15 ? '#ff4444' :
                             h.stamina < CONFIG.STAMINA_MAX * 0.30 ? '#ffaa00' : '#44ff44';
    document.getElementById('hudSpeedFill').style.width = spPct + '%';
    document.getElementById('hudKakari').style.display = h.isKakari ? 'block' : 'none';
  }

  // ==== SECTION: INPUT ====
  const currentInput = { accel: false, hold: false, laneDir: 0 };

  let swipeStartX = null;

  function setupInput() {
    const canvas = renderer.domElement;

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        swipeStartX = t.clientX;
      }
    }, { passive: false });

    canvas.addEventListener('touchend', e => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        const dx = t.clientX - (swipeStartX ?? t.clientX);
        if (Math.abs(dx) > 40) {
          // Swipe: lane change
          currentInput.laneDir = dx > 0 ? 1 : -1;
          setTimeout(() => { currentInput.laneDir = 0; }, 80);
        } else {
          // Tap: left/right edge = lane change
          if (t.clientX < innerWidth * 0.2) {
            currentInput.laneDir = -1;
            setTimeout(() => { currentInput.laneDir = 0; }, 80);
          } else if (t.clientX > innerWidth * 0.8) {
            currentInput.laneDir = 1;
            setTimeout(() => { currentInput.laneDir = 0; }, 80);
          }
        }
      }
      swipeStartX = null;
    }, { passive: false });

    // Button hold
    const btnAccel = document.getElementById('btnAccel');
    const btnHold  = document.getElementById('btnHold');
    ['touchstart','mousedown'].forEach(ev => {
      btnAccel.addEventListener(ev, e => { e.preventDefault(); currentInput.accel = true;  });
      btnHold.addEventListener (ev, e => { e.preventDefault(); currentInput.hold  = true;  });
    });
    ['touchend','touchcancel','mouseup'].forEach(ev => {
      btnAccel.addEventListener(ev, () => { currentInput.accel = false; });
      btnHold.addEventListener (ev, () => { currentInput.hold  = false; });
    });

    // Keyboard fallback for desktop testing
    window.addEventListener('keydown', e => {
      if (e.repeat) return;
      if (e.key === 'ArrowUp' || e.key === ' ') currentInput.accel = true;
      else if (e.key === 'ArrowDown') currentInput.hold = true;
      else if (e.key === 'ArrowLeft') { currentInput.laneDir = -1; setTimeout(() => { currentInput.laneDir = 0; }, 80); }
      else if (e.key === 'ArrowRight') { currentInput.laneDir = 1; setTimeout(() => { currentInput.laneDir = 0; }, 80); }
    });
    window.addEventListener('keyup', e => {
      if (e.key === 'ArrowUp' || e.key === ' ') currentInput.accel = false;
      else if (e.key === 'ArrowDown') currentInput.hold = false;
    });
  }
  setupInput();

  // ==== SECTION: UI-SCREENS ====
  function startRace() {
    // Generate race
    const rng = makeRng(Date.now() & 0xFFFFFFFF);
    const cond = createRaceConditions(rng);
    const field = generateField(rng, cond);

    // Build/reset horse meshes
    horseMeshes.forEach(m => scene.remove(m));
    horseMeshes = [];
    field.forEach(def => {
      const m = createHorseModel(def.color, def.color); // use same color for silks for now
      scene.add(m);
      horseMeshes.push(m);
    });

    raceState = createRaceState(field, cond, makeRng((Date.now() + 1) & 0xFFFFFFFF), 0);
    shownResults = false;
    accumulator = 0;

    // Place meshes at the gate immediately so frame 1 looks right
    updateHorseMeshes(raceState, 0);
    updateCamera(raceState);

    document.getElementById('screenTitle').style.display  = 'none';
    document.getElementById('screenResult').style.display = 'none';
    document.getElementById('hud').style.display          = 'block';
    document.getElementById('controls').style.display     = 'block';
    // controls are display:block but pointer-events handled per button
    document.getElementById('controls').style.pointerEvents = 'none'; // container transparent
  }

  function showFinishScreen(state) {
    const playerResult = state.results.find(r => r.index === state.playerIndex);
    const rank = playerResult?.rank ?? state.finishedCount;
    const time = playerResult?.finishTime ?? state.elapsed;
    const h = state.field[state.playerIndex];

    // Score calculation
    const rankPts  = CONFIG.RANK_POINTS[rank - 1] ?? 10;
    const baseTime = state.cond.baseTime;
    const timeDiff = baseTime - time; // positive = faster than par
    const timeBonus= Math.min(CONFIG.TIME_BONUS_MAX, Math.max(0, Math.floor(timeDiff * 10) * CONFIG.TIME_BONUS_PER_TENTH));
    const score = rankPts + timeBonus;

    const rankLabels = ['','1着','2着','3着','4着','5着','6着','7着','8着','9着','10着','11着','12着'];

    document.getElementById('resultRank' ).textContent = rankLabels[rank] ?? `${rank}着`;
    document.getElementById('resultHorse').textContent = `${h.num}番 ${h.name}`;
    document.getElementById('resultTime' ).textContent = `走破タイム: ${time.toFixed(1)}s`;
    document.getElementById('resultScore').textContent = `スコア: ${score}点（着順${rankPts} + タイム${timeBonus}）`;
    document.getElementById('screenResult').style.display = 'flex';
    document.getElementById('hud').style.display = 'none';
    document.getElementById('controls').style.display = 'none';
  }

  document.getElementById('btnStart').addEventListener('click', () => { startRace(); });
  document.getElementById('btnRetry').addEventListener('click', () => { startRace(); });
  </script>
</body>
