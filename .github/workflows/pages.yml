name: Validate and deploy Pages

on:
  pull_request:
  push:
    branches: ["claude/eager-wozniak-1oe5zz"]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'push' && github.ref == 'refs/heads/claude/eager-wozniak-1oe5zz' && 'production' || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/check-site.py
      - run: node tools/share.test.mjs
      - run: node --test tools/social-card.test.mjs tools/share-visibility.test.mjs
      - run: node tools/audio.test.mjs
      - run: node tools/participation.test.mjs
      - run: node tools/ranking.test.mjs
      - run: node tools/i18n.test.mjs
      - run: node tools/input.test.mjs
      - run: node tools/sim-harness.mjs 10 random 1 random
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - name: Save anonymous actual-game capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: johba-share-capture
          path: |
            test-results/share-capture/
            test-results/share-visible/
          if-no-files-found: ignore
      - name: Stage the validated public file
        run: python3 tools/check-site.py --out _site
      - name: Upload this commit's Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/claude/eager-wozniak-1oe5zz'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/eager-wozniak-1oe5zz'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject stale commits and require the Actions publishing source
        uses: actions/github-script@v7
        with:
          script: |
            const { data: branch } = await github.rest.repos.getBranch({
              ...context.repo, branch: context.ref.replace('refs/heads/', '')
            });
            if (branch.commit.sha !== context.sha) {
              throw new Error('A newer release commit exists; refusing stale deployment.');
            }
            const { data: pages } = await github.rest.repos.getPages(context.repo);
            if (pages.build_type !== 'workflow') {
              throw new Error('Before merging, set Settings > Pages > Source to GitHub Actions.');
            }
      - name: Deploy only the artifact from this validated commit
        id: deployment
        uses: actions/deploy-pages@v4

